<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test CropGuard Backend</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #result { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 4px; white-space: pre-wrap; font-family: monospace;}
  </style>
</head>
<body>
  <h1>Test Backend Image Upload</h1>
  <form id="uploadForm">
    <input type="file" id="imageInput" name="image" accept="image/*" required>
    <button type="submit">Analyze Image</button>
  </form>
  
  <div id="loading" style="display: none; margin-top: 1rem;">Analyzing... (This might take 30-60 seconds on the first run)</div>
  <div id="result"></div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').textContent = '';

      try {
        const response = await fetch('http://localhost:5000/api/analyze', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        document.getElementById('result').textContent = 'Error: ' + error.message;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    });
  </script>
</body>
</html>
